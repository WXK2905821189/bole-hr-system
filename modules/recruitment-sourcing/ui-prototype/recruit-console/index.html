<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>伯乐识才台 · 招聘提效模块</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f54eb'/%3E%3Ctext x='16' y='22' font-size='17' font-family='PingFang SC,Microsoft YaHei,sans-serif' font-weight='800' fill='%23fff' text-anchor='middle'%3E%E8%81%98%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="dashboard">
  <!-- ============ App Shell · 三段式新版侧栏（运营台 / 沟通·触达 / 治理+系统） ============ -->
  <aside class="app-nav">
    <div class="logo">
      <div class="mark">聘</div>
      <div style="display:flex;flex-direction:column">
        <span class="name">伯乐识才台</span>
        <span class="sub">招募提效模块 · 已启用</span>
      </div>
    </div>
    <nav>
      <div class="navsec">运营台</div>
      <button class="navitem active" data-nav="dashboard" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="3" y="10" width="8" height="11" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/></svg>运营总览</button>
      <button class="navitem" data-nav="jobs" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>招聘岗位</button>
      <button class="navitem" data-nav="schedule" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 11h16"/></svg>采集调度</button>
      <button class="navitem" data-nav="candidates" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.5-3.5 3-5.5 5.5-5.5s5 2 5.5 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 13.5c2.8.3 4.5 2.3 4.9 5.5"/></svg>候选人库<span class="n" id="navCand">12</span></button>
      <button class="navitem" data-nav="talent" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l-6 5v13h12V8l-6-5z"/><circle cx="12" cy="12" r="2.4"/></svg>人才库<span class="n" id="navTalent"></span></button>
      <div class="navsec">沟通 · 触达</div>
      <button class="navitem" data-nav="engage" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 01-12.8 7.3L3 21l1.6-4.4A8.5 8.5 0 1121 11.5z"/><path d="M8.5 11.5h7M8.5 14.5h4"/></svg>触达沟通<span class="n w" id="navEngage">4</span></button>
      <button class="navitem" data-nav="engageaudit" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M6 7h12l-1.5 13a2 2 0 01-2 1.8H9.5a2 2 0 01-2-1.8L6 7z"/><path d="M10 11v5M14 11v5"/></svg>触达审计</button>
      <div class="navsec">治理</div>
      <button class="navitem" data-nav="audit" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><rect x="7" y="9.5" width="10" height="5" rx="2.5" transform="rotate(45 12 12)"/></svg>审计留痕</button>
      <button class="navitem" data-nav="settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z"/><path d="M19 12a7 7 0 01.1-1l2-1.5-2-3.4-2.4.7a7.5 7.5 0 00-1.7-1L14.8 3.4h-5.6l-.4 2.4a7.5 7.5 0 00-1.7 1l-2.4-.7-2 3.4 2 1.5a7 7 0 000 2l-2 1.5 2 3.4 2.4-.7a7.5 7.5 0 001.7 1l.4 2.4h5.6l.4-2.4a7.5 7.5 0 001.7-1l2.4.7 2-3.4-2-1.5a7 7 0 01-.1-1z" stroke-linecap="round" stroke-linejoin="round"/></svg>准入与护栏</button>
      <div class="navsec">系统</div>
      <button class="navitem" data-nav="logs" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>运行日志</button>
    </nav>
    <div class="foot">
      <div class="ava">王</div>
      <div style="flex:1;min-width:0;line-height:1.35">
        <span class="fname">招聘专员 · 王女士</span>
      </div>
      <button class="btn ghost sm" style="border-color:#26304d;color:#cdd6f4;flex:none" type="button">退出</button>
    </div>
  </aside>

  <!-- ============ App Content ============ -->
  <main class="app-content">
    <header class="topbar">
      <div style="display:flex;flex-direction:column"><h1 id="pageTitle">运营总览</h1><span class="crumb" id="pageSub">候选人寻源 · 控制台</span></div>
      <div class="headright">
        <div class="health"><span class="dot"></span>网关已连接</div>
        <button class="btn ghost sm" id="btnRefresh" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-2.6-6.4M21 5v4h-4"/></svg>刷新</button>
        <button class="btn" id="btnTopRun" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4l14 8-14 8V4z"/></svg>运行采集</button>
      </div>
    </header>

    <div class="content">
      <!-- ===== 视图：运营总览 ===== -->
      <section class="view active" id="view-dashboard"></section>

      <!-- ===== 视图：岗位 / JD ===== -->
      <section class="view" id="view-jobs"></section>

      <!-- ===== 视图：采集调度 ===== -->
      <section class="view" id="view-schedule"></section>

      <!-- ===== 视图：候选人库 ===== -->
      <section class="view" id="view-candidates"></section>

      <!-- ===== 视图：人才库（共享 · 账号无关） ===== -->
      <section class="view" id="view-talent"></section>

      <!-- ===== 视图：触达沟通 ===== -->
      <section class="view" id="view-engage"></section>

      <!-- ===== 视图：触达审计 ===== -->
      <section class="view" id="view-engageaudit"></section>

      <!-- ===== 视图：审计留痕 ===== -->
      <section class="view" id="view-audit"></section>

      <!-- ===== 视图：准入与护栏 ===== -->
      <section class="view" id="view-settings"></section>

      <!-- ===== 视图：运行日志 ===== -->
      <section class="view" id="view-logs"></section>
    </div>
  </main>

  <!-- Drawer + Scrim (候选人详情) -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-hd">
      <div class="ava" id="dAva">陈</div>
      <div>
        <div class="nm" id="dName">—</div>
        <div class="meta" id="dMeta">—</div>
      </div>
      <button class="x" id="drawerClose" type="button">×</button>
    </div>
    <div class="drawer-bd" id="drawerBd"></div>
    <div class="drawer-ft">
      <button class="btn sm" style="flex:1" id="dMark" type="button">标记已沟通</button>
      <button class="btn ghost sm" style="flex:1" id="dDecrypt" type="button">解密查看</button>
    </div>
  </aside>

  <!-- Modal (新增岗位) -->
  <div class="modal" id="jobModal">
    <div class="modal-bg" data-close></div>
    <div class="modal-card">
      <h3>新增岗位（粘贴 JD，自动解析关键词）</h3>
      <label>岗位 ID</label>
      <input type="text" id="mJobId" placeholder="例如 backend_02" />
      <label>岗位名称</label>
      <input type="text" id="mTitle" placeholder="例如 后端工程师" />
      <label>JD 原文</label>
      <textarea id="mJd" placeholder="粘贴岗位职责 / 要求，系统将自动抽取学历、经验、技能关键词…">3–5 年 Java/Go 后端开发经验；熟练掌握 MySQL、Redis；熟悉微服务架构与高并发场景。</textarea>
      <div class="modal-ft">
        <button class="btn ghost" id="modalCancel" type="button">取消</button>
        <button class="btn" id="modalCreate" type="button">创建并解析</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
